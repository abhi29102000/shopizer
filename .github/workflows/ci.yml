name: CI

on:
  push:
  pull_request:

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install all modules
        run: mvn install -DskipTests --no-transfer-progress

      - name: Run unit tests
        run: mvn test -pl sm-core,sm-shop --no-transfer-progress -Dtest="!ProductTest"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/target/surefire-reports/*.xml'

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install all modules
        run: mvn install -DskipTests --no-transfer-progress

      - name: Run integration tests
        run: |
          mvn test -pl sm-shop --no-transfer-progress \
            -Dtest="**/integration/**/*Test" \
            -DfailIfNoTests=false

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/target/surefire-reports/*.xml'

  build-artifact:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-jar
          path: sm-shop/target/shopizer.jar

      - name: Trigger infra build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_TOKEN }}
          repository: abhi29102000/shopizer-infra
          event-type: ci-complete
